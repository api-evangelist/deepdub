overlay: 1.0.0
info:
  title: API Evangelist enhancements for Deepdub (api)
  version: 1.0.0
extends: openapi/deepdub-api-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: true
    x-apievangelist-provider: deepdub
    x-apievangelist-auth: apiKey (x-api-key, dd- prefix)
- target: $.info
  update:
    x-apievangelist-rate-limits: '5 concurrent per customer / 3 per IP'
    x-apievangelist-regions: [us, eu]
