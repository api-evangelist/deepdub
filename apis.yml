aid: deepdub
name: Deepdub
description: >-
  Deepdub is an AI dubbing, voice-cloning, and text-to-speech company that turns content into
  natural, emotionally adaptive speech across 100+ languages. Its platform powers media dubbing
  for studios such as Paramount, Netflix, and Prime Video, real-time AI voice agents (~125ms
  latency), video localization, live broadcast, and voice cloning. Deepdub exposes a developer
  platform: a REST Text-to-Speech API (restapi.deepdub.ai) covering TTS generation, a voice bank,
  gender detection, usage, and issue tracking; a Managed Dubbing API (dubbing.deepdub.app) for
  end-to-end video dubbing jobs; and a WebSocket streaming API for real-time audio. Authentication
  is via an x-api-key header, with Python and Node.js SDKs, published OpenAPI specs, and agent
  files (AGENTS.md, Cursor skill). Deepdub is backed by Insight Partners.
